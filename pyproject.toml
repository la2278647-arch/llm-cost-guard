[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost-guard"
version = "0.1.0"
description = "Track, budget, and control LLM API spending across providers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "llm-cost-guard contributors"}]
keywords = ["llm", "openai", "anthropic", "deepseek", "cost", "tokens", "budget"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/yourname/llm-cost-guard"

[project.scripts]
lcg = "llm_cost_guard.cli:main"

[tool.setuptools.packages.find]
include = ["llm_cost_guard*"]
